spring.application.name=deepresearch
server.port=8081
spring.threads.virtual.enabled=true
spring.profiles.active=@spring.profiles.active@

# Gemini (cloud) default model; overridden per-request via GoogleGenAiChatOptions
spring.ai.google.genai.chat.options.model=gemini-2.5-pro
spring.ai.google.genai.chat.options.google-search-retrieval=false

# Ollama (local)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4:26b

research.max-sources=5
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
