spring.application.name=deepresearch
server.port=8081
spring.threads.virtual.enabled=true
spring.config.import=optional:file:secrets.properties
app.llm.use-ollama=false

# Gemini (cloud)
spring.ai.google.genai.chat.options.model=gemini-2.5-pro
spring.ai.google.genai.chat.options.google-search-retrieval=false

# Ollama (local) used when app.llm.use-ollama=true
spring.ai.model.chat.type=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4:26b
browserbase.api-key=${browserbase.api-key}
research.max-sources=5
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
